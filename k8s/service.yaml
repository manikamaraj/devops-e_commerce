apiVersion: v1
kind: Service
metadata:
  name: novacart-mongo
spec:
  selector:
    app: novacart-mongo
  ports:
    - name: mongodb
      port: 27017
      targetPort: 27017
  type: ClusterIP
---
apiVersion: v1
kind: Service
metadata:
  name: novacart-service
spec:
  selector:
    app: novacart-app
  ports:
    - name: http
      port: 80
      targetPort: 5000
  type: NodePort
  # Kubernetes assigns a NodePort automatically.
